[config]
skip_core_tasks = true
default_to_workspace = false

[tasks.prod]
command = "cargo"
args = ["build", "--workspace", "--release", "--features", "prod"]

[tasks.default]
alias = "prod"

[tasks.bundle]
description = "Tauri release 打包：前端构建 + Tauri release bundle（NSIS .exe）"
script_runner = "@shell"
script = "npm run build"

[tasks.release]
description = "Tauri 桌面端发布打包（bundle 别名）"
alias = "bundle"

[tasks.app]
description = "Tauri build：只编译桌面程序可执行文件，不打安装包（--no-bundle）"
script_runner = "@shell"
script = "npx tauri build --no-bundle"

[tasks.check]
description = "Run all checks: fmt, clippy, and tests"
dependencies = ["_check_fmt", "_check_clippy"]


[tasks._check_fmt]
command = "cargo"
args = ["fmt", "--all"]

[tasks._check_clippy]
command = "cargo"
args = ["clippy", "--workspace", "--", "-D", "warnings"]
