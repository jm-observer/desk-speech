# Standalone TTS bake-off — deliberately NOT in server/compose.yaml so it
# cannot disturb the production asr/orchestrator. Run from ~/server/tts on GB10:
#   docker compose -f compose.tts.yaml up -d --build
services:
  cosyvoice:
    build:
      context: .
      dockerfile: Dockerfile.cosyvoice
    image: cosyvoice2:bakeoff
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - COSYVOICE_MODEL=/models/CosyVoice2-0.5B
      - COSYVOICE_FP16=0
      - TTS_PORT=8095
    volumes:
      - ${MODELS_DIR:-/home/fengqi/funasr-prep/models}:/models:ro
      - ${TTS_IO:-/home/fengqi/tts-io}:/io
    ports:
      - "8095:8095"

  gptsovits:
    build:
      context: .
      dockerfile: Dockerfile.gptsovits
    image: gptsovits:bakeoff
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      # Pretrained assets live on the host (kept out of the image).
      - ${GS_ASSETS:-/home/fengqi/gpt-sovits-assets}/pretrained_models:/app/GPT-SoVITS/GPT_SoVITS/pretrained_models:ro
      - ${GS_ASSETS:-/home/fengqi/gpt-sovits-assets}/G2PWModel:/app/GPT-SoVITS/GPT_SoVITS/text/G2PWModel:ro
      - ${GS_ASSETS:-/home/fengqi/gpt-sovits-assets}/nltk_data:/root/nltk_data:ro
      # Shared I/O: reference clips, outputs, fine-tune datasets + weights.
      - ${TTS_IO:-/home/fengqi/tts-io}:/io
      # Persist the FunASR/ModelScope/HF caches.
      - ${GS_CACHE:-/home/fengqi/gpt-sovits-cache}/dot_cache:/root/.cache
      # The fine-tune ASR step (funasr_asr.py) snapshot_downloads ~1.1GB of
      # paraformer/punc/vad into tools/asr/models — pre-seed it so the first
      # real fine-tune doesn't pay a ~30min download.
      - ${GS_CACHE:-/home/fengqi/gpt-sovits-cache}/asr_models:/app/GPT-SoVITS/tools/asr/models
    ports:
      - "8096:9880"
