# Standalone TTS service — deliberately NOT in server/compose.yaml so it
# cannot disturb the production asr/orchestrator. Run from ~/server/tts on GB10:
#   docker compose -f compose.tts.yaml up -d --build
#
# GPT-SoVITS was removed from this compose (2026-05-28) — CosyVoice2 is the
# chosen engine after the bake-off. To bring sovits back temporarily, see
# git history for the prior definition.
services:
  cosyvoice:
    build:
      context: .
      dockerfile: Dockerfile.cosyvoice
    image: cosyvoice2:bakeoff
    runtime: nvidia
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - COSYVOICE_MODEL=/models/CosyVoice2-0.5B
      - COSYVOICE_FP16=0
      - TTS_PORT=8095
      - VOICES_DIR=/voices
    volumes:
      - ${MODELS_DIR:-/home/fengqi/funasr-prep/models}:/models:ro
      - ${TTS_IO:-/home/fengqi/tts-io}:/io
      # Voice library (voices.json + raw/*.wav). Host source of truth lives
      # at the path below; CosyVoice2 reads it for the /tts and /voices
      # endpoints. Hot-editable — /voices re-reads on each call.
      - ${TTS_VOICES:-/home/fengqi/tts-voices}:/voices:ro
    ports:
      - "8095:8095"
