[package]
name = "asr-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
sherpa-onnx = { version = "1.13.0", default-features = false, features = ["shared"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# Plan C: from-source HTTP 下载（流式 + 体积上限）。rustls 避免 slim 镜像缺 openssl。
# 显式 0.13 与 custom-utils trace 客户端同源（不可 workspace=true：Docker 独立构建无父 workspace）。
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "http2"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

# 全链路追踪（trace-hub）。仅当运行时设 TRACE_HUB_ENDPOINT 才启用，未设零运行时影响。
# 显式 registry 版本（不可 workspace=true：Docker 独立构建无父 workspace）。0.15+ 已上
# 临时 git rev 依赖以拿到 SpanScope 两阶段 emit API（标准化 request/response 落库
# 模式）；待 0.16 发布到 crates.io 后改回 version 依赖。Docker 构建时容器从公网拉
# git rev，命中容器内 cargo git cache。
custom-utils = { git = "https://github.com/jm-observer/custom-utils.git", rev = "6254e583ba356b08918c183d465737b3b4652caa", default-features = false, features = ["trace"] }
