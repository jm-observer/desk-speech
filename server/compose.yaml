# GB10 服务端 compose。**只剩 asr**——orchestrator 已于 2026-06 迁出至 toolkit 仓
# (crates/orchestrator),改为宿主 systemd 服务部署(toolkit `deploy-g10.ps1 -Service
# orchestrator`),不再容器化。vLLM 维持主机现状,不在此 compose 内。
# orchestrator 作为宿主进程经 127.0.0.1:9110 连本 asr(见下 ports 注释)。
services:
  asr:
    build: ./asr            # 薄层,FROM funasr-asr:arm64(已验证基镜像)
    image: funasr-asr:svc
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # 换模型只改这里 / 改挂载,代码与协议不变
      - ASR_PARAFORMER_DIR=/models/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch
      - ASR_SENSEVOICE_DIR=/models/SenseVoiceSmall
      - ASR_WHISPER_TURBO_DIR=/models/Whisper-large-v3-turbo
      - ASR_WHISPER_LARGE_DIR=/models/Whisper-large-v3
      - ASR_VAD_DIR=/models/speech_fsmn_vad_zh-cn-16k-common-pytorch
      - ASR_PUNC_DIR=/models/punc_ct-transformer_zh-cn-common-vocab272727-pytorch
      # 2026-09-04 关停：上线 12 小时里它改写了 8 次输出，而当时没有任何手段判断
      # 这些改写是好是坏（没音频、没参考转写、日志也没记下判断所需的字段）。
      # 不是「已证明有害」，是「无法评估」。前缀上下文解码当前**关停**。要做影子采集时改成：
      #   ASR_CTX_PREFIX_MAX_MS=3000  +  ASR_CTX_PREFIX_SHADOW=1
      # 影子模式照跑整条路径并落盘，但始终返回原文，对用户输出零影响。
      # 重开条件见 docs/asr-ctx-prefix-postmortem.md，别只把 MAX_MS 调回来就上。
      - ASR_CTX_PREFIX_MAX_MS=0
      - ASR_CTX_PREFIX_SHADOW=0
      # 观测落盘目录（宿主机挂载卷；写容器内路径重建即丢，上次就是这么丢的）
      - ASR_CTX_OBS_DIR=/var/log/asr-ctx
      - ASR_DEVICE=cuda
      - ASR_PORT=9100
      # 反向拉取声纹/配置:orchestrator 已迁出容器,现为宿主 toolkit-server 进程
      # (:8788,其路由 nest 在 /api/asr 下)。容器经 host-gateway 回连宿主;
      # 末段 /api/asr 让 app.py 的 `{ORCH_BASE}/api/voiceprints` 命中
      # /api/asr/api/voiceprints。缺省 http://orchestrator:8090 在迁出后已失效
      # (容器内 DNS 解析失败 → 声纹恒空 → 门控形同关闭)。
      - ORCH_BASE=http://host.docker.internal:8788/api/asr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MODELS_DIR:-/home/fengqi/funasr-prep/models}:/models:ro
      # 影子期的观测数据（含用户语音副本）。保留期见 postmortem §性质 5，
      # 宿主侧另有 TTL 清理（scripts/asr-ctx-ttl.sh），不依赖容器是否还在跑。
      - ./asr-ctx-shadow:/var/log/asr-ctx
    expose:
      - "9100"
    ports:
      # 内部 WS :9100 —— compose 内仍走服务名 `asr`;另发布到本机回环,供已迁出
      # 容器的 orchestrator(toolkit 仓,宿主 systemd 进程)连接。
      # orchestrator 默认 ASR_WS=ws://127.0.0.1:9100。仅本机回环,不上 LAN。
      # (trace-hub 已让出 9100,挪到 :9120;见 trace-hub/deploy-g10.ps1。)
      - "127.0.0.1:9100:9100"
      # /embed + /transcribe HTTP 给同机外部消费(toolkit 抖音管线调 /transcribe);
      # 仅本机回环,避免无意暴露到 LAN。
      - "127.0.0.1:9101:9101"
