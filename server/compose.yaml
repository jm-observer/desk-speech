# GB10 服务端编排(P0)。vLLM 维持主机现状,不在此 compose 内。
services:
  asr:
    build: ./asr            # 薄层,FROM funasr-asr:arm64(已验证基镜像)
    image: funasr-asr:svc
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # 换模型只改这里 / 改挂载,代码与协议不变
      - ASR_PARAFORMER_DIR=/models/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch
      - ASR_SENSEVOICE_DIR=/models/SenseVoiceSmall
      - ASR_VAD_DIR=/models/speech_fsmn_vad_zh-cn-16k-common-pytorch
      - ASR_PUNC_DIR=/models/punc_ct-transformer_zh-cn-common-vocab272727-pytorch
      - ASR_DEVICE=cuda
      - ASR_PORT=9100
    volumes:
      - ${MODELS_DIR:-/home/fengqi/funasr-prep/models}:/models:ro
    expose:
      - "9100"

  orchestrator:
    build: ./orchestrator
    image: orchestrator:latest
    restart: unless-stopped
    depends_on:
      - asr
    environment:
      - ORCH_BIND=0.0.0.0:8090          # 对客户端的 WebSocket
      - ASR_WS=ws://asr:9100            # 内部 ASR 服务
      # vLLM 在主机上;host.docker.internal 经 extra_hosts 解析
      - VLLM_BASE=http://host.docker.internal:8085/v1
      - VLLM_MODEL=gemma-4-26B-A4B-it
      - DATA_DIR=/data                  # SQLite persistence (sessions/segments/speakers/config)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - orch-data:/data
    ports:
      - "8090:8090"

  # asr-server:外部 OpenAI 兼容 ASR(/v1/audio/transcriptions),sherpa-onnx 后端。
  # 默认不参与 `docker compose up -d`,需 `--profile asr-server` 才纳管(避免影响生产栈)。
  # v1 CPU SenseVoice;GPU/CUDA13 是后续工作(详见 asr-server/Dockerfile 注释)。
  asr-server:
    profiles: [asr-server]
    build: ./asr-server
    image: asr-server:latest
    restart: unless-stopped
    environment:
      - RUST_LOG=info
    volumes:
      - ${ASR_SERVER_MODELS_DIR:-/home/fengqi/asr-server-models}:/models:ro
    ports:
      - "8091:8091"

volumes:
  orch-data:
