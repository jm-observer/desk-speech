# GB10 服务端编排(P0)。vLLM 维持主机现状,不在此 compose 内。
services:
  asr:
    build: ./asr            # 薄层,FROM funasr-asr:arm64(已验证基镜像)
    image: funasr-asr:svc
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # 换模型只改这里 / 改挂载,代码与协议不变
      - ASR_PARAFORMER_DIR=/models/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch
      - ASR_SENSEVOICE_DIR=/models/SenseVoiceSmall
      - ASR_WHISPER_TURBO_DIR=/models/Whisper-large-v3-turbo
      - ASR_WHISPER_LARGE_DIR=/models/Whisper-large-v3
      - ASR_VAD_DIR=/models/speech_fsmn_vad_zh-cn-16k-common-pytorch
      - ASR_PUNC_DIR=/models/punc_ct-transformer_zh-cn-common-vocab272727-pytorch
      - ASR_DEVICE=cuda
      - ASR_PORT=9100
    volumes:
      - ${MODELS_DIR:-/home/fengqi/funasr-prep/models}:/models:ro
    expose:
      - "9100"

  orchestrator:
    build: ./orchestrator
    image: orchestrator:latest
    restart: unless-stopped
    depends_on:
      - asr
    environment:
      - ORCH_BIND=0.0.0.0:8090          # 对客户端的 WebSocket
      - ASR_WS=ws://asr:9100            # 内部 ASR 服务
      # vLLM 在主机上;host.docker.internal 经 extra_hosts 解析
      - VLLM_BASE=http://host.docker.internal:8085/v1
      - VLLM_MODEL=gemma-4-26B-A4B-it
      - DATA_DIR=/data                  # SQLite persistence (sessions/segments/speakers/config)
      # 全链路追踪(trace-hub 宿主进程在 :9100)。未设此变量则零追踪、零影响。
      - TRACE_HUB_ENDPOINT=http://host.docker.internal:9100/v1/spans
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - orch-data:/data
    ports:
      - "8090:8090"

  # asr-server:外部 OpenAI 兼容 ASR(/v1/audio/transcriptions),sherpa-onnx 后端。
  # 默认不参与 `docker compose up -d`,需 `--profile asr-server` 才纳管(避免影响生产栈)。
  # v1 CPU SenseVoice;GPU/CUDA13 是后续工作(详见 asr-server/Dockerfile 注释)。
  asr-server:
    profiles: [asr-server]
    build: ./asr-server
    image: asr-server:latest
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      # 全链路追踪（trace-hub 宿主进程在 :9100）。容器经 host.docker.internal 到宿主。
      # 未设此变量则 asr-server 全程零追踪、零影响——要关闭追踪删掉本行即可。
      - TRACE_HUB_ENDPOINT=http://host.docker.internal:9100/v1/spans
    # trace-hub 在宿主，非 compose 内服务；同 orchestrator 连 vLLM 的方式打通。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # from-source 的 file:// 读的是容器内路径:把宿主 zero 下载目录挂进容器
    # 同路径,否则 from-source 必 404(见 plan §6.3)。下载实际落 downloads/douyin/。
    volumes:
      - ${ASR_SERVER_MODELS_DIR:-/home/fengqi/asr-server-models}:/models:ro
      - ${ZERO_DOWNLOADS_DIR:-/home/fengqi/.config/zero/downloads}:/home/fengqi/.config/zero/downloads:ro
    # command 注入部署相关参数:from-source 白名单(配父目录即覆盖 douyin/ 子目录)。
    # 容器内 bind 0.0.0.0(docker 端口转发需要);对外暴露由下方 ports 限本机。
    command:
      - "--bind"
      - "0.0.0.0:8091"
      - "--model"
      - "sense-voice"
      - "--model-dir"
      - "/models/sherpa-sense-voice"
      - "--vad-model"
      - "/opt/asr-server/silero_vad.onnx"
      - "--source-allowlist"
      - "/home/fengqi/.config/zero/downloads"
    # 仅暴露给 GB10 本机(zero 同机调用);要对局域网开放需显式改这里。
    ports:
      - "127.0.0.1:8091:8091"

volumes:
  orch-data:
