[package]
name = "non-streaming-speech-recognition-from-microphone"
version = "1.13.0"
description = "Non-streaming speech recognition from microphone with VAD"
edition = "2021"

[lib]
name = "non_streaming_speech_recognition_from_microphone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
deadpool-sqlite = { version = "0.13.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
# sherpa-onnx = { path = "../../../sherpa-onnx/rust/sherpa-onnx", default-features = false }

# cpal: cross-platform audio I/O — works on Linux (ALSA/PulseAudio), macOS (CoreAudio), Windows (WASAPI).
cpal = "0.16"
log = "0.4.29"
# chrono: wall-clock timestamps for segment results.
chrono = "0.4"
async-openai = { version = "0.36.1", features = ["chat-completion", "model"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1.0.149"
custom-utils = "0.11.7"
tokio = { version = "1", features = ["full"] }
# Remote ASR (redesign): WebSocket client to the GB10 orchestrator.
tokio-tungstenite = "0.24"
futures-util = "0.3"
